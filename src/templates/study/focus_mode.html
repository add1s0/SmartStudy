{% extends "base.html" %}
{% load static %}
{% block title %}Фокус режим | Smart Study{% endblock %}
{% block body_class %}background-page{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-7 col-lg-6">
        <div class="card shadow-sm text-center"><div class="card-body p-5">
            <h1>Фокус режим</h1>
            <p class="text-muted">Студирай 25 фокусирани минути.</p>
            <div id="timer" class="timer my-4">25:00</div>
            <button class="btn btn-accent" id="startButton">Старт</button>
            <button class="btn btn-primary" id="pauseButton">Пауза</button>
            <button class="btn btn-outline-secondary" id="resetButton">Рестарт</button>
        </div></div>
    </div>
</div>
{% endblock %}
{% block scripts %}
<script src="{% static 'js/focus.js' %}"></script>
{% endblock %}

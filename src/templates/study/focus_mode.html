{% extends "base.html" %}
{% load static %}
{% block title %}Focus Mode | Smart Study AI{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-7 col-lg-6">
        <div class="card shadow-sm text-center"><div class="card-body p-5">
            <h1>Focus Mode</h1>
            <p class="text-muted">Study for 25 focused minutes.</p>
            <div id="timer" class="timer my-4">25:00</div>
            <button class="btn btn-accent" id="startButton">Start</button>
            <button class="btn btn-primary" id="pauseButton">Pause</button>
            <button class="btn btn-outline-secondary" id="resetButton">Reset</button>
        </div></div>
    </div>
</div>
{% endblock %}
{% block scripts %}
<script src="{% static 'js/focus.js' %}"></script>
{% endblock %}

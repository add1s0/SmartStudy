{% extends "base.html" %}
{% block title %}Резултат от теста | Smart Study{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-7">
        <div class="card shadow-sm text-center">
            <div class="card-body p-5">
                <h1 class="h3">Тестът е завършен</h1>
                <p class="display-4 fw-bold text-primary">{{ percentage|floatformat:0 }}%</p>
                <p>Отговори правилно на {{ score }} от {{ total }} въпроса.</p>
                <div class="alert alert-info">{{ recommendation }}</div>
                <a class="btn btn-accent" href="{% url 'quiz_mode' material.id %}">Опитай отново</a>
                <a class="btn btn-outline-primary" href="{% url 'material_detail' material.id %}">Обратно към материала</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}

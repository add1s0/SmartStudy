{% extends "base.html" %}
{% block title %}{{ title }} | Smart Study{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="card shadow-sm">
            <div class="card-body p-4">
                <h1 class="h3">{{ title }}</h1>
                <p class="text-muted">Въведи ясни бележки с пълни изречения за по-добри резултати.</p>
                <form method="post">
                    {% csrf_token %}
                    {{ form.as_p }}
                    <button class="btn btn-accent" type="submit">Запази материал</button>
                    <a class="btn btn-outline-secondary" href="{% url 'material_list' %}">Отказ</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}

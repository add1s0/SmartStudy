{% extends "base.html" %}
{% block title %}Регистрация | Smart Study{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-7 col-lg-6">
        <div class="card shadow-sm">
            <div class="card-body p-4">
                <h1 class="h3 mb-3">Създай акаунт</h1>
                <form method="post">
                    {% csrf_token %}
                    {{ form.as_p }}
                    <button class="btn btn-accent w-100" type="submit">Регистрация</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}

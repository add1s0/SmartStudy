{% extends "base.html" %}
{% block title %}Вход | Smart Study{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
        <div class="card shadow-sm">
            <div class="card-body p-4">
                <h1 class="h3 mb-3">Вход</h1>
                <form method="post">
                    {% csrf_token %}
                    {{ form.as_p }}
                    <button class="btn btn-accent w-100" type="submit">Вход</button>
                </form>
                <p class="mt-3 mb-0">Нов потребител? <a href="{% url 'register' %}">Създай акаунт</a>.</p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
